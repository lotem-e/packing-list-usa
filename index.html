<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימת אריזה — ארה"ב 2026 · לוטם ועתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dust:#EDEBE4;
    --card:#FBFAF6;
    --ink:#242938;
    --ink2:#666B7D;
    --line:#DBD8CD;
    --neon-p:#E9398C;
    --neon-c:#1FB3C9;
    --violet:#6E5AE0;
    --wire:linear-gradient(270deg, var(--neon-p), var(--violet), var(--neon-c));
    --r:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--dust); color:var(--ink);
    font-family:"Heebo", -apple-system, "Segoe UI", Arial, sans-serif;
    font-size:16px; line-height:1.55;
  }
  /* ── פס עליון דביק ── */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(237,235,228,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar .in{
    max-width:680px; margin:0 auto; padding:10px 18px 6px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .name{
    font-family:"Karantina", "Heebo", sans-serif; font-weight:700;
    font-size:26px; line-height:1; margin-inline-end:auto;
  }
  .topbar .tally{font-size:14px; color:var(--ink2); font-weight:500; white-space:nowrap}
  .topbar .tally b{color:var(--ink); font-size:16px}
  .editbtn{
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink2);
    background:none; border:1.5px solid var(--line); border-radius:99px;
    padding:4px 13px; cursor:pointer; white-space:nowrap;
  }
  .editmode .editbtn{
    color:var(--violet); border-color:var(--violet);
    box-shadow:0 0 8px rgba(110,90,224,.3);
  }
  .editbtn:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  .tabs{max-width:680px; margin:0 auto; padding:0 18px 10px; display:flex; gap:7px}
  .tabbtn{
    flex:1; font-family:inherit; cursor:pointer; text-align:center;
    background:transparent; color:var(--ink2);
    border:1.5px solid var(--line); border-radius:13px; padding:6px 4px 5px;
  }
  .tabbtn .nm{display:block; font-family:"Karantina",sans-serif; font-weight:700; font-size:23px; line-height:1.05}
  .tabbtn .ct{display:block; font-size:11px; font-weight:500; margin-top:2px}
  .tabbtn[data-tab="L"]{--pc:var(--neon-p)}
  .tabbtn[data-tab="A"]{--pc:var(--neon-c)}
  .tabbtn[data-tab="S"]{--pc:var(--violet)}
  .tabbtn.on{
    background:var(--card); color:var(--ink); border-color:transparent;
    box-shadow:inset 0 -3px 0 0 var(--pc), 0 1px 4px rgba(36,41,56,.06);
  }
  .tabbtn:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  .wire{height:5px; background:#E3E1D8; position:relative}
  .wire i{
    position:absolute; inset-inline-start:0; top:0; bottom:0; width:0%;
    background:var(--wire); border-radius:0 3px 3px 0;
    box-shadow:0 0 10px rgba(233,57,140,.55), 0 0 22px rgba(110,90,224,.35);
    transition:width .35s ease;
  }
  /* ── פתיח ── */
  .wrap{max-width:680px; margin:0 auto; padding:26px 18px 80px}
  .hero h1{
    font-family:"Karantina", sans-serif; font-weight:700;
    font-size:clamp(46px, 13vw, 74px); line-height:.95; margin:6px 0 10px;
  }
  .hero h1 .glow{
    background:var(--wire); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(233,57,140,.35));
  }
  /* ── טאבים ── */
  .tabpane{display:none}
  .tabpane.on{display:block}
  .ptitle{display:none}
  /* ── קבוצות ── */
  section.grp{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    margin-top:22px; overflow:hidden;
  }
  .gh{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:16px 18px 10px;
  }
  .gh h2{
    margin:0; font-family:"Karantina",sans-serif; font-weight:700;
    font-size:30px; line-height:1.05; letter-spacing:.01em;
  }
  .gh h2 small{
    display:block; font-family:"Heebo",sans-serif; font-weight:500;
    font-size:13px; color:var(--ink2); letter-spacing:0; margin-top:3px;
  }
  section.grp.full .gh h2{
    background:var(--wire); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .gh .cnt{font-size:14px; color:var(--ink2); font-weight:700; white-space:nowrap}
  .gbar{height:3px; margin:0 18px; background:#ECEAE2; border-radius:2px; overflow:hidden}
  .gbar i{display:block; height:100%; width:0%; background:var(--wire); transition:width .3s ease}
  section.grp ul{list-style:none; margin:6px 0 0; padding:4px 10px 12px}
  h3.sub{
    margin:14px 10px 2px; font-size:12.5px; font-weight:700; color:var(--violet);
    letter-spacing:.14em;
  }
  /* ── פריטים ── */
  li.it{border-radius:12px; display:flex; align-items:stretch}
  li.it label{
    flex:1 1 auto; display:flex; align-items:flex-start; gap:12px;
    padding:10px 8px; cursor:pointer; border-radius:12px; min-width:0;
  }
  li.it label:active{background:rgba(110,90,224,.06)}
  li.it input{position:absolute; opacity:0; width:1px; height:1px}
  .box{
    flex:0 0 auto; width:23px; height:23px; margin-top:2px;
    border:2px solid #A9AEBE; border-radius:7px; position:relative;
    transition:all .15s ease; background:#fff;
  }
  .box::after{
    content:""; position:absolute; left:50%; top:50%; width:12px; height:7px;
    border-left:2.5px solid #fff; border-bottom:2.5px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg) scale(0); transform-origin:center;
    transition:transform .15s ease;
  }
  li.it input:checked ~ .box{
    background:var(--neon-p); border-color:var(--neon-p);
    box-shadow:0 0 9px rgba(233,57,140,.55);
  }
  .tabpane[data-tab="A"] li.it input:checked ~ .box{
    background:var(--neon-c); border-color:var(--neon-c);
    box-shadow:0 0 9px rgba(31,179,201,.55);
  }
  .tabpane[data-tab="S"] li.it input:checked ~ .box{
    background:var(--violet); border-color:var(--violet);
    box-shadow:0 0 9px rgba(110,90,224,.55);
  }
  li.it input:checked ~ .box::after{transform:translate(-50%,-60%) rotate(-45deg) scale(1)}
  li.it input:focus-visible ~ .box{outline:3px solid var(--violet); outline-offset:2px}
  .tx{flex:1 1 auto; min-width:0}
  .tx small{display:block; color:var(--ink2); font-size:13px; line-height:1.45; margin-top:1px}
  li.it.done .tx{color:var(--ink2); text-decoration:line-through; text-decoration-color:rgba(102,107,125,.6)}
  li.it.done .tx small{text-decoration:none; opacity:.7}
  /* ── עריכה ── */
  .ictl{display:none; align-items:center; gap:6px; padding-inline-start:2px; padding-inline-end:4px}
  .editmode .ictl{display:flex}
  .ictl button{
    width:31px; height:31px; border-radius:10px; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--ink2);
    font-size:14px; line-height:1; padding:0;
  }
  .ictl button:hover{color:var(--ink); border-color:var(--ink2)}
  .ictl button.del:hover{color:var(--neon-p); border-color:var(--neon-p)}
  .ictl button:focus-visible{outline:3px solid var(--violet); outline-offset:1px}
  li.addrow{
    margin:8px 8px 2px; padding:9px 12px; border:1.5px dashed var(--line);
    border-radius:12px; color:var(--ink2); font-weight:500; font-size:14.5px;
    cursor:pointer; list-style:none;
  }
  li.addrow:hover{color:var(--ink); border-color:var(--ink2)}
  li.edrow{list-style:none; padding:6px 2px}
  .ed{
    display:flex; flex-direction:column; gap:8px;
    background:#fff; border:1.5px solid var(--violet); border-radius:12px; padding:12px;
    box-shadow:0 0 10px rgba(110,90,224,.18);
  }
  .ed input{
    font:inherit; color:var(--ink); background:var(--dust);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;
  }
  .ed input:focus{outline:2px solid var(--violet); outline-offset:1px}
  .ed input.en{font-size:14px}
  .edbtns{display:flex; gap:8px; justify-content:flex-start}
  .edsave{
    font:inherit; font-weight:700; font-size:14px; color:#fff; background:var(--ink);
    border:none; border-radius:99px; padding:7px 18px; cursor:pointer;
  }
  .edcancel{
    font:inherit; font-size:14px; color:var(--ink2); background:none;
    border:1.5px solid var(--line); border-radius:99px; padding:7px 15px; cursor:pointer;
  }
  .edsave:focus-visible,.edcancel:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  /* ── תחתית ── */
  .foot{
    margin-top:30px; display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .fbtns{display:flex; gap:8px; flex-wrap:wrap}
  .save{font-size:13.5px; color:var(--ink2); transition:color .2s}
  .save.flash{color:var(--neon-p); font-weight:700}
  button.reset{
    font-family:inherit; font-size:14px; font-weight:700; color:var(--ink2);
    background:none; border:1.5px solid var(--line); border-radius:99px;
    padding:8px 18px; cursor:pointer;
  }
  button.reset:hover{color:var(--ink); border-color:var(--ink2)}
  button.reset:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  #restoreBtn{display:none}
  .editmode #restoreBtn{display:inline-block}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
  @media print{
    .topbar,.foot,.ictl,li.addrow{display:none}
    body{background:#fff}
    .tabpane{display:block !important}
    .ptitle{
      display:block; font-family:"Karantina",sans-serif; font-weight:700;
      font-size:32px; margin:26px 0 0;
    }
    section.grp{border-color:#bbb; break-inside:auto}
    li.it{break-inside:avoid}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <span class="name">רשימת האריזה</span>
    <span class="tally"><b id="doneAll">0</b> / <span id="totAll">0</span> נארזו</span>
    <button class="editbtn" id="editBtn">✎ עריכה</button>

  <div class="tabs" role="tablist">

    <button class="tabbtn" data-tab="A" role="tab"><span class="nm">עתי</span><span class="ct" data-ct="A">0 / 0</span></button>
    <button class="tabbtn" data-tab="S" role="tab"><span class="nm">ביחד</span><span class="ct" data-ct="S">0 / 0</span></button>

  <div class="wire"><i id="wireAll"></i></div>

    <div class="fbtns">

      <button class="reset" id="restoreBtn">שחזור הרשימה המקורית</button>

    <span class="save" id="saveNote">ההתקדמות נשמרת אוטומטית</span>

</div>

  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('לנקות את כל הסימונים ברשימה של ״' + NAMES[activeTab] + '״? הפריטים עצמם יישארו.')) return;
    ORDER[activeTab].forEach(function(k){
      state.lists[activeTab][k].forEach(function(it){ it.d = false; });
    });
    editing = null;
    render();
    persist();
  });

  document.getElementById('restoreBtn').addEventListener('click', function(){
    if (!confirm('לשחזר את הרשימה המקורית של ״' + NAMES[activeTab] + '״? פריטים שהוספתם או ערכתם בטאב הזה יימחקו, והסימונים בו יתאפסו.')) return;
    state.lists[activeTab] = seedTab(activeTab);
    editing = null;
    render();
    persist();
  });

  // משיכת עדכונים מהצד השני (רק במצב משותף של Claude)
  function pullRemote(){
    if (!SHARED || !state || editing || saveTimer) return;
    store.get(KEY, true).then(function(v){
      if (!v) return;
      var rem = null;
      try { rem = JSON.parse(v); } catch(e){ return; }
      if (!rem || !rem.lists) return;
      var rts = rem.ts || 0;
      if (rts <= localTs) return;
      if (editing || saveTimer) return;
      localTs = rts;
      state.lists = rem.lists;
      buildIndex();
      render();
      setTabUI();
    });
  }
  function startPoll(){
    if (!SHARED) return;
    setInterval(pullRemote, 12000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) pullRemote();
    });
  }

  function finish(){
    render();
    setTabUI();
    startPoll();
  }
  function boot(lists){
    state = {v: 3, lists: lists};
    buildIndex();
    store.get(TABKEY, false).then(function(t){
      if (t === 'A' || t === 'S' || t === 'L') activeTab = t;
      finish();
    });
  }
  function seedFromV2(ov){
    var lists = seedAll();
    if (ov){
      try {
        var old2 = JSON.parse(ov) || {};
        var idx = {};
        ['L','A','S'].forEach(function(p){
          ORDER[p].forEach(function(k){
            lists[p][k].forEach(function(it){ idx[it.id] = it; });
          });
        });
        Object.keys(old2).forEach(function(id){
          if (old2[id] === true && idx[id]) idx[id].d = true;
        });
      } catch(e){}
    }
    return lists;
  }
  function init(){
    if (store.mode === 'none'){
      SAVETXT = 'שמירה זמנית — בתצוגה הזו השינויים לא נשמרים';
      saveNote.textContent = SAVETXT;
      boot(seedAll());
      return;
    }
    SAVETXT = SHARED ? 'מסתנכרן בין שניכם אוטומטית' : 'נשמר במכשיר הזה אוטומטית';
    saveNote.textContent = SAVETXT;
    store.get(KEY, true).then(function(v){
      var loaded = null;
      if (v){ try { loaded = JSON.parse(v); } catch(e){} }
      if (loaded && loaded.lists){
        localTs = loaded.ts || 0;
        boot(loaded.lists);
        return;
      }
      if (!SHARED){
        boot(seedAll());
        persist();
        return;
      }
      // אין עדיין מצב משותף — מעבירים מהשמירה האישית הקודמת
      store.get(KEY, false).then(function(pv){
        var old3 = null;
        if (pv){ try { old3 = JSON.parse(pv); } catch(e){} }
        if (old3 && old3.lists){
          boot(old3.lists);
          persist();
          return;
        }
        store.get(OLDKEY, false).then(function(ov){
          boot(seedFromV2(ov));
          persist();
        });
      });
    });
  }
  init();
})();
</script>
</body>
</html>
