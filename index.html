<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merica! Oh my here we go again</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --dust:#EDEBE4;
    --card:#FBFAF6;
    --ink:#242938;
    --ink2:#666B7D;
    --line:#DBD8CD;
    --neon-p:#E9398C;
    --neon-c:#1FB3C9;
    --violet:#6E5AE0;
    --wire:linear-gradient(270deg, var(--neon-p), var(--violet), var(--neon-c));
    --r:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--dust); color:var(--ink);
    font-family:"Heebo", -apple-system, "Segoe UI", Arial, sans-serif;
    font-size:16px; line-height:1.55;
  }
  /* ── פס עליון דביק ── */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(237,235,228,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar .in{
    max-width:680px; margin:0 auto; padding:10px 18px 6px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .name{
    font-family:"Karantina", "Heebo", sans-serif; font-weight:700;
    font-size:26px; line-height:1; margin-inline-end:auto;
  }
  .topbar .tally{font-size:14px; color:var(--ink2); font-weight:500; white-space:nowrap}
  .topbar .tally b{color:var(--ink); font-size:16px}
  .tabs{max-width:680px; margin:0 auto; padding:0 18px 10px; display:flex; gap:7px}
  .tabbtn{
    flex:1; font-family:inherit; cursor:pointer; text-align:center;
    background:transparent; color:var(--ink2);
    border:1.5px solid var(--line); border-radius:13px; padding:6px 4px 5px;
  }
  .tabbtn .nm{display:block; font-family:"Karantina",sans-serif; font-weight:700; font-size:23px; line-height:1.05}
  .tabbtn .ct{display:block; font-size:11px; font-weight:500; margin-top:2px}
  .tabbtn[data-tab="L"]{--pc:var(--neon-p)}
  .tabbtn[data-tab="A"]{--pc:var(--neon-c)}
  .tabbtn[data-tab="S"]{--pc:var(--violet)}
  .tabbtn.on{
    background:var(--card); color:var(--ink); border-color:transparent;
    box-shadow:inset 0 -3px 0 0 var(--pc), 0 1px 4px rgba(36,41,56,.06);
  }
  .tabbtn:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  .wire{height:5px; background:#E3E1D8; position:relative}
  .wire i{
    position:absolute; inset-inline-start:0; top:0; bottom:0; width:0%;
    background:var(--wire); border-radius:0 3px 3px 0;
    box-shadow:0 0 10px rgba(233,57,140,.55), 0 0 22px rgba(110,90,224,.35);
    transition:width .35s ease;
  }
  /* ── פתיח ── */
  .wrap{max-width:680px; margin:0 auto; padding:26px 18px 80px}
  .hero h1{
    font-family:"Karantina", sans-serif; font-weight:700;
    font-size:clamp(46px, 13vw, 74px); line-height:.95; margin:6px 0 10px;
  }
  .hero h1 .glow{
    background:var(--wire); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(233,57,140,.35));
  }
  /* ── טאבים ── */
  .tabpane{display:none}
  .tabpane.on{display:block}
  .ptitle{display:none}
  /* ── קבוצות ── */
  section.grp{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    margin-top:22px; overflow:hidden;
  }
  .gh{
    display:flex; align-items:center; gap:12px;
    padding:16px 18px 10px; cursor:pointer;
    transition:padding-bottom .3s ease;
  }
  section.grp.fold .gh{padding-bottom:16px}
  .gh h2{flex:1; min-width:0}
  .ghb{all:unset; display:block; cursor:pointer}
  .ghb:focus-visible{outline:3px solid var(--violet); outline-offset:3px; border-radius:6px}
  .gh h2{
    margin:0; font-family:"Karantina",sans-serif; font-weight:700;
    font-size:30px; line-height:1.05; letter-spacing:.01em;
  }
  .gh h2 small{
    display:block; font-family:"Heebo",sans-serif; font-weight:500;
    font-size:13px; color:var(--ink2); letter-spacing:0; margin-top:3px;
  }
  section.grp.full .gh h2{
    background:var(--wire); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .gh .cnt{font-size:14px; color:var(--ink2); font-weight:700; white-space:nowrap}
  /* צמדי "כמה מתוך" מתרנדרים כיחידה LTR, אחרת הסדר מתהפך בשורה עברית */
  .cnt,.ct,.num{direction:ltr; unicode-bidi:isolate}
  .chev{display:flex; color:var(--ink2); flex:0 0 auto}
  .chev svg{width:20px; height:20px; transition:transform .3s ease}
  section.grp:not(.fold) .chev svg{transform:rotate(180deg)}
  .gh:hover .chev{color:var(--ink)}
  /* קיפול: אנימציית grid מ־1fr ל־0fr - בלי למדוד גבהים ב־JS */
  .gbody{display:grid; grid-template-rows:1fr; transition:grid-template-rows .3s ease}
  .gbody > .gin{overflow:hidden; min-height:0}
  section.grp.fold .gbody{grid-template-rows:0fr}
  section.grp ul{list-style:none; margin:6px 0 0; padding:4px 10px 12px}
  h3.sub{
    margin:14px 10px 2px; font-size:12.5px; font-weight:700; color:var(--violet);
    letter-spacing:.14em;
    display:flex; align-items:center; gap:2px;
  }
  .sub .edb{width:30px; height:30px}
  .sub .edb svg{width:13px; height:13px}
  /* ── פריטים ── */
  li.it{border-radius:12px; display:flex; align-items:stretch}
  li.it label{
    flex:1 1 auto; display:flex; align-items:flex-start; gap:12px;
    padding:10px 8px; cursor:pointer; border-radius:12px; min-width:0;
  }
  li.it label:active{background:rgba(110,90,224,.06)}
  li.it input{position:absolute; opacity:0; width:1px; height:1px}
  .box{
    flex:0 0 auto; width:23px; height:23px; margin-top:2px;
    border:2px solid #A9AEBE; border-radius:7px; position:relative;
    transition:all .15s ease; background:#fff;
  }
  .box::after{
    content:""; position:absolute; left:50%; top:50%; width:12px; height:7px;
    border-left:2.5px solid #fff; border-bottom:2.5px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg) scale(0); transform-origin:center;
    transition:transform .15s ease;
  }
  li.it input:checked ~ .box{
    background:var(--neon-p); border-color:var(--neon-p);
    box-shadow:0 0 9px rgba(233,57,140,.55);
  }
  .tabpane[data-tab="A"] li.it input:checked ~ .box{
    background:var(--neon-c); border-color:var(--neon-c);
    box-shadow:0 0 9px rgba(31,179,201,.55);
  }
  .tabpane[data-tab="S"] li.it input:checked ~ .box{
    background:var(--violet); border-color:var(--violet);
    box-shadow:0 0 9px rgba(110,90,224,.55);
  }
  li.it input:checked ~ .box::after{transform:translate(-50%,-60%) rotate(-45deg) scale(1)}
  li.it input:focus-visible ~ .box{outline:3px solid var(--violet); outline-offset:2px}
  .tx{flex:1 1 auto; min-width:0}
  .tx small{display:block; color:var(--ink2); font-size:13px; line-height:1.45; margin-top:1px}
  li.it.done .tx{color:var(--ink2); text-decoration:line-through; text-decoration-color:rgba(102,107,125,.6)}
  li.it.done .tx small{text-decoration:none; opacity:.7}
  /* ── עריכה: עיפרון שקט בשורות ובכותרות ── */
  .ictl{display:flex; align-items:center; padding-inline-end:2px}
  .edb{
    width:42px; height:42px; align-self:center; border-radius:12px; cursor:pointer;
    border:none; background:none; color:var(--ink2); opacity:.65; padding:0;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .15s ease, background .15s ease;
  }
  .edb svg{width:17px; height:17px; display:block}
  .edb:hover{opacity:1; color:var(--ink); background:rgba(36,41,56,.06)}
  .edb:focus-visible{outline:3px solid var(--violet); outline-offset:1px; opacity:1}
  .gh .edb{width:38px; height:38px}
  /* כותרת במצב עריכה: הכרטיס תופס את כל רוחב הכותרת */
  .gh.ghed{display:block; cursor:default}
  li.addbar{display:flex; gap:8px; margin:8px 8px 2px; list-style:none}
  .addrow,.addcat{
    font-family:inherit; padding:9px 12px; border:1.5px dashed var(--line);
    border-radius:12px; color:var(--ink2); font-weight:500; font-size:14.5px;
    cursor:pointer; background:none;
  }
  .addrow{flex:1 1 auto}
  .addcat{flex:0 0 auto; white-space:nowrap}
  .addrow:hover,.addcat:hover{color:var(--ink); border-color:var(--ink2)}
  .addrow:focus-visible,.addcat:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  li.edrow{list-style:none; padding:6px 2px}
  .ed{
    display:flex; flex-direction:column; gap:8px;
    background:#fff; border:1.5px solid var(--violet); border-radius:12px; padding:12px;
    box-shadow:0 0 10px rgba(110,90,224,.18);
  }
  .ed input{
    font:inherit; color:var(--ink); background:var(--dust);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;
  }
  .ed input:focus{outline:2px solid var(--violet); outline-offset:1px}
  .ed input.en{font-size:14px}
  .ed select{
    font:inherit; color:var(--ink); background:var(--dust);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;
  }
  .ed select:focus{outline:2px solid var(--violet); outline-offset:1px}
  .ed label.fl{
    display:flex; flex-direction:column; gap:5px;
    font-size:12px; font-weight:700; color:var(--ink2);
  }
  .edbtns{display:flex; gap:8px; align-items:center}
  .eddel{
    font:inherit; font-size:14px; font-weight:500; color:var(--ink2); background:none;
    border:none; border-radius:99px; padding:7px 12px; cursor:pointer;
    margin-inline-start:auto;
  }
  .eddel:hover{color:var(--neon-p); background:rgba(233,57,140,.07)}
  .eddel:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  .edsave{
    font:inherit; font-weight:700; font-size:14px; color:#fff; background:var(--ink);
    border:none; border-radius:99px; padding:7px 18px; cursor:pointer;
  }
  .edcancel{
    font:inherit; font-size:14px; color:var(--ink2); background:none;
    border:1.5px solid var(--line); border-radius:99px; padding:7px 15px; cursor:pointer;
  }
  .edsave:focus-visible,.edcancel:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  /* ── תחתית ── */
  .foot{margin-top:30px; display:flex}
  button.reset{
    font-family:inherit; font-size:14px; font-weight:700; color:var(--ink2);
    background:none; border:1.5px solid var(--line); border-radius:99px;
    padding:8px 18px; cursor:pointer;
  }
  button.reset:hover{color:var(--ink); border-color:var(--ink2)}
  button.reset:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  /* ── טוסט עם ביטול פעולה ── */
  .toast{
    position:fixed; bottom:16px; inset-inline:16px; z-index:30;
    display:flex; align-items:center; gap:6px;
    width:fit-content; max-width:calc(100vw - 32px); margin-inline:auto;
    background:var(--ink); color:#fff; border-radius:99px;
    padding:8px 18px 8px 8px; box-shadow:0 6px 24px rgba(36,41,56,.35);
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:none; pointer-events:auto}
  .toast .msg{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .toast button{
    font:inherit; font-size:14px; font-weight:700; color:#fff;
    background:rgba(255,255,255,.16); border:none; border-radius:99px;
    padding:6px 14px; cursor:pointer; white-space:nowrap;
  }
  .toast button:hover{background:rgba(255,255,255,.26)}
  .toast button:focus-visible{outline:3px solid var(--neon-c); outline-offset:2px}
  /* ── מסך התחברות ── */
  .auth{
    position:fixed; inset:0; z-index:50; background:var(--dust);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth[hidden]{display:none}
  .authcard{
    width:100%; max-width:360px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--r); padding:26px 22px;
    display:flex; flex-direction:column; gap:12px;
  }
  .authcard h2{
    margin:0 0 2px; font-family:"Karantina",sans-serif; font-weight:700;
    font-size:40px; line-height:1;
  }
  .authcard h2 span{
    background:var(--wire); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .authbtn{
    font:inherit; font-weight:700; font-size:15px; color:#fff; background:var(--ink);
    border:none; border-radius:99px; padding:11px 18px; cursor:pointer; margin-top:4px;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .authbtn svg{width:18px; height:18px; flex:0 0 auto}
  .authbtn:disabled{opacity:.6}
  .authbtn:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  .autherr{min-height:1.2em; font-size:13.5px; color:var(--neon-p); font-weight:500}
  /* ── טאבים ראשיים: המסלול | משימות ואריזה ── */
  .maintabs{max-width:680px; margin:0 auto; padding:0 18px 10px; display:flex; gap:7px}
  .mtab{
    flex:1; font-family:"Karantina","Heebo",sans-serif; font-weight:700; font-size:22px;
    line-height:1.05; cursor:pointer; text-align:center; color:var(--ink2);
    background:transparent; border:1.5px solid var(--line); border-radius:13px; padding:7px 4px 6px;
  }
  .mtab.on{
    background:var(--card); color:var(--ink); border-color:transparent;
    box-shadow:inset 0 -3px 0 0 var(--violet), 0 1px 4px rgba(36,41,56,.06);
  }
  .mtab:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  /* אלמנטים ששייכים רק לטאב האריזה נעלמים כשמציגים את המסלול */
  body.vroute .packonly{display:none}
  #view-route{display:none}
  body.vroute #view-route{display:block}
  body.vroute #view-packing{display:none}
  /* ── טאב המסלול ── */
  .rwrap{max-width:1100px; margin:0 auto; padding:26px 18px 60px}
  .gmaps{
    display:inline-flex; align-items:center; gap:7px; margin:2px 0 14px;
    font-size:14px; font-weight:700; color:var(--ink2); text-decoration:none;
    border:1.5px solid var(--line); border-radius:99px; padding:7px 16px;
  }
  .gmaps:hover{color:var(--ink); border-color:var(--ink2)}
  .gmaps:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  @media (max-width: 480px){
    .topbar .name{font-size:19px}
  }
  .routegrid{display:flex; gap:16px; align-items:stretch; margin-top:10px}
  .rpanel{flex:0 0 330px; max-height:72vh; overflow-y:auto; padding-inline-end:4px}
  .rmap-box{flex:1 1 auto; min-width:0}
  .rmap{
    height:72vh; border-radius:var(--r); border:1px solid var(--line);
    background:var(--card); overflow:hidden;
  }
  .dcard{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; margin-bottom:10px; cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .dcard:hover{border-color:var(--ink2)}
  .dcard.on{border-color:var(--violet); box-shadow:0 0 8px rgba(110,90,224,.25)}
  .dcard:focus-visible{outline:3px solid var(--violet); outline-offset:2px}
  .dcard .dd{font-size:12.5px; color:var(--ink2); font-weight:700}
  .dcard .dn{
    font-family:"Karantina","Heebo",sans-serif; font-weight:700; font-size:25px; line-height:1.1;
    display:flex; align-items:center; gap:7px;
  }
  .dcard .drv{font-size:12.5px; color:var(--violet); font-weight:700; margin-top:1px}
  .dcard .nt{font-size:13px; color:var(--ink2); line-height:1.45; margin-top:3px}
  /* מרקרים */
  .mk{
    width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:"Heebo",sans-serif; font-weight:700; font-size:12.5px;
    border:2px solid #fff; box-shadow:0 1px 6px rgba(36,41,56,.4);
    direction:ltr; white-space:nowrap;
  }
  .mk.burn{
    width:40px; height:40px; font-size:19px; background:var(--neon-p);
    box-shadow:0 0 14px rgba(233,57,140,.75);
  }
  /* פופאפים בשפת הכרטיסים של האתר */
  .leaflet-popup-content-wrapper{
    background:var(--card); color:var(--ink); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 6px 24px rgba(36,41,56,.2);
    direction:rtl; font-family:"Heebo",-apple-system,"Segoe UI",Arial,sans-serif;
  }
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-popup-content{margin:12px 15px; line-height:1.5}
  .pp-name{font-family:"Karantina","Heebo",sans-serif; font-weight:700; font-size:24px; line-height:1.1}
  .pp-date{font-size:12.5px; color:var(--ink2); font-weight:700; margin-top:1px}
  .pp-note{font-size:13px; color:var(--ink2); margin-top:4px; max-width:210px}
  .rmap-fallback{
    height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--ink2); font-size:14.5px; text-align:center; padding:20px;
  }
  @media (max-width: 768px){
    .routegrid{flex-direction:column}
    .rpanel{flex:none; max-height:none; overflow:visible; order:2; padding-inline-end:0}
    .rmap-box{order:1}
    .rmap{height:52vh}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
  @media print{
    .topbar,.foot,.ictl,li.addbar,.edb,.toast,#view-route{display:none}
    body.vroute #view-packing{display:block}
    body{background:#fff}
    .tabpane{display:block !important}
    .ptitle{
      display:block; font-family:"Karantina",sans-serif; font-weight:700;
      font-size:32px; margin:26px 0 0;
    }
    section.grp{border-color:#bbb; break-inside:auto}
    section.grp.fold .gbody{grid-template-rows:1fr}
    .chev{display:none}
    li.it{break-inside:avoid}
  }
</style>
</head>
<body class="vroute">

<div class="topbar">
  <div class="in">
    <span class="name"><bdi id="siteName">Merica! Oh my here we go again</bdi></span>
    <span class="tally packonly"><span class="num"><b id="doneAll">0</b> / <span id="totAll">0</span></span> נארזו</span>
  </div>
  <div class="maintabs">
    <button class="mtab on" data-view="route">המסלול</button>
    <button class="mtab" data-view="packing">משימות ואריזה</button>
  </div>
  <div class="tabs packonly" role="tablist">
    <button class="tabbtn on" data-tab="L" role="tab"><span class="nm">לוטם</span><span class="ct" data-ct="L">0 / 0</span></button>
    <button class="tabbtn" data-tab="A" role="tab"><span class="nm">עתי</span><span class="ct" data-ct="A">0 / 0</span></button>
    <button class="tabbtn" data-tab="S" role="tab"><span class="nm">ביחד</span><span class="ct" data-ct="S">0 / 0</span></button>
  </div>
  <div class="wire packonly"><i id="wireAll"></i></div>
</div>

<div id="view-route">
  <div class="rwrap">
    <div class="hero">
      <h1 id="routeHero">שורפים<br><span class="glow">את הכביש</span></h1>
    </div>
    <a class="gmaps" href="https://maps.app.goo.gl/avzwcXWqtKTci4RA9" target="_blank" rel="noopener">🧭 המסלול המלא בגוגל מפות</a>
    <div class="routegrid">
      <div class="rpanel" id="rpanel"></div>
      <div class="rmap-box"><div class="rmap" id="rmap" dir="ltr"></div></div>
    </div>
  </div>
</div>

<div id="view-packing">
<div class="wrap">

  <div class="hero">
    <h1>אורזים<br><span class="glow">כמו בוערים</span></h1>
  </div>

  <div class="tabpane on" data-tab="L" id="pane-L"></div>
  <div class="tabpane" data-tab="A" id="pane-A"></div>

    var n = enEl ? enEl.value.trim() : '';
    var ed = editing;
    // שמירה על שדה ריק סוגרת את העורך - זו גם הדרך לסיים רצף הוספות
    if (!tx){ editing = null; rerenderSec(ed.p, ed.k); return; }
    if (ed.sec){
      // עריכת כותרת הקבוצה: אם חזרנו בדיוק לברירת המחדל, מוחקים את הדריסה
      var key = ed.p + '-' + ed.k;
      if (tx === SEC[ed.k].t && n === SEC[ed.k].s) delete state.titles[key];
      else state.titles[key] = {t: tx, s: n};
      editing = null;
    } else if (ed.cat){
      // קטגוריה חדשה נולדת רק עם הפריט הראשון שלה: פותחים עורך פריט
      // כשהקטגוריה כבר מסומנת, ועדיין אין מה לשמור
      editing = {p: ed.p, k: ed.k, id: null, draft: {t: '', n: '', s: tx}};
      rerenderSec(ed.p, ed.k);
      return;
    } else if (ed.catEdit){
      if (tx === ed.catEdit){ editing = null; rerenderSec(ed.p, ed.k); return; }
      renameCat(ed.p, ed.k, ed.catEdit, tx);
      editing = null;
    } else if (ed.id){
      var r = byId[ed.id];
      if (r){
        r.it.t = tx;
        r.it.n = n;
        var sel = card.querySelector('.ecat');
        if (sel && sel.value !== (r.it.s || '')){
          // שינוי קטגוריה: מוציאים את הפריט ממקומו ומכניסים בסוף הקטגוריה החדשה
          var arr0 = state.lists[ed.p][ed.k];
          var ix0 = arr0.indexOf(r.it);
          if (ix0 > -1) arr0.splice(ix0, 1);
          r.it.s = sel.value;
          insertByCat(arr0, r.it);
        }
      }
      editing = null;
    } else {
      var arr = state.lists[ed.p][ed.k];
      var sel2 = card.querySelector('.ecat');
      var item = {id: newId(), t: tx, n: n, s: sel2 ? sel2.value : '', d: false};
      insertByCat(arr, item);
      // הוספה רציפה: שורה ריקה חדשה שזוכרת את הקטגוריה שנבחרה
      editing = {p: ed.p, k: ed.k, id: null, draft: {t: '', n: '', s: item.s}};
    }
    rerenderSec(ed.p, ed.k);
    persist();
  }

  function setTabUI(){
    document.querySelectorAll('.tabbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === activeTab); });
    document.querySelectorAll('.tabpane').forEach(function(pn){ pn.classList.toggle('on', pn.dataset.tab === activeTab); });
  }
  function setTab(t){
    if (editing){ editing = null; render(); }
    activeTab = t;
    setTabUI();
    store.set(TABKEY, t, false);
    window.scrollTo(0, 0);
  }

  document.addEventListener('change', function(ev){
    var cb = ev.target;
    if (!cb || cb.type !== 'checkbox' || !cb.dataset.id) return;
    var r = byId[cb.dataset.id];
    if (!r) return;
    r.it.d = cb.checked;
    // אם עורכים באותה קבוצה - שומרים את הטיוטה לפני הרינדור מחדש
    if (editing && editing.p === r.p && editing.k === r.k) captureDraft();
    rerenderSec(r.p, r.k);
    persist();
  });

  document.addEventListener('click', function(ev){
    var t = ev.target;
    if (!t || !t.closest) return;
    var add = t.closest('.addrow');
    if (add){
      editing = {p: add.dataset.p, k: add.dataset.k, id: null, draft: null};
      rerenderSec(editing.p, editing.k);
      return;
    }
    var ac = t.closest('.addcat');
    if (ac){
      editing = {p: ac.dataset.p, k: ac.dataset.k, cat: true, draft: null};
      rerenderSec(editing.p, editing.k);
      return;
    }
    // closest ולא בדיקת target ישירה - כי הקליק יכול לפגוע ב־SVG שבתוך הכפתור
    var eb = t.closest('button.edb');
    if (eb){
      var prev = editing;
      if (eb.classList.contains('ghe')){
        // עיפרון של כותרת קבוצה
        editing = {p: eb.dataset.p, k: eb.dataset.k, sec: true, draft: null};
      } else if (eb.classList.contains('sce')){
        // עיפרון של קטגוריה
        editing = {p: eb.dataset.p, k: eb.dataset.k, catEdit: eb.dataset.cat, draft: null};
      } else {
        // עיפרון של פריט
        var r = byId[eb.dataset.id];
        if (!r) return;
        editing = {p: r.p, k: r.k, id: r.it.id, draft: null};
      }
      if (prev && (prev.p !== editing.p || prev.k !== editing.k)) rerenderSec(prev.p, prev.k);
      rerenderSec(editing.p, editing.k);
      return;
    }
    // מחיקה מתוך כרטיס העריכה: מוחקים מיד, והטוסט מציע ביטול
    var db = t.closest('button.eddel');
    if (db){
      var r2 = byId[db.dataset.id];
      if (!r2) return;
      var arr = state.lists[r2.p][r2.k];
      var ix = arr.indexOf(r2.it);
      if (ix > -1) arr.splice(ix, 1);
      editing = null;
      setUndo({type: 'del', p: r2.p, k: r2.k, ix: ix, item: r2.it}, 'נמחק: ״' + r2.it.t + '״');
      rerenderSec(r2.p, r2.k);
      persist();
      return;
    }
    if (t.closest('button.edsave')){ saveEditor(t); return; }
    if (t.closest('button.edcancel')){
      var ed = editing; editing = null;
      if (ed) rerenderSec(ed.p, ed.k);
      return;
    }
    // לחיצה בכל שטח כותרת הקבוצה מקפלת או פותחת אותה,
    // חוץ מלחיצות בתוך כרטיס עריכה פתוח (עורך הכותרת יושב בתוך ה־gh)
    var gh = t.closest('.gh');
    if (gh && !t.closest('.ed')){
      var secEl = gh.closest('section.grp');
      if (secEl) toggleFold(secEl);
      return;
    }
  });

  document.addEventListener('keydown', function(ev){
    if (!editing) return;
    if (ev.key === 'Enter' && ev.target && (ev.target.classList.contains('etx') || ev.target.classList.contains('en'))){
      ev.preventDefault();
      saveEditor(ev.target);
    }
    if (ev.key === 'Escape'){
      var ed = editing; editing = null;
      rerenderSec(ed.p, ed.k);
    }
  });

  document.querySelectorAll('.tabbtn').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
  });

  // ── טוסט + ביטול הפעולה האחרונה ──
  // במקום חלונות אישור: הפעולה קורית מיד, והטוסט מחזיק "ביטול" ממוקד לכמה שניות.
  // הביטול מחזיר רק את מה שהפעולה שינתה, כך שסימונים שנעשו בינתיים לא נדרסים.
  var toastEl = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var toastUndoBtn = document.getElementById('toastUndo');
  var toastTimer = null, undoAct = null;

  function showToast(msg, canUndo){
    if (!canUndo) undoAct = null;
    toastMsg.textContent = msg;
    toastUndoBtn.style.display = canUndo ? '' : 'none';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast(){
    clearTimeout(toastTimer);
    toastEl.classList.remove('show');
    undoAct = null;
  }
  function setUndo(u, msg){
    undoAct = u;
    showToast(msg, true);
  }
  toastUndoBtn.addEventListener('click', function(){
    if (!undoAct) return;
    var u = undoAct;
    if (u.type === 'del'){
      // החזרת פריט שנמחק למקומו המקורי
      var arr = state.lists[u.p][u.k];
      arr.splice(Math.min(u.ix, arr.length), 0, u.item);
    }
    hideToast();
    editing = null;
    render();
    persist();
  });

  // משיכת עדכונים מהצד השני (רק במצב משותף של Claude)
  function pullRemote(){
    if (!SHARED || !state || editing || saveTimer) return;
    store.get(KEY, true).then(function(v){
      if (!v) return;
      var rem = null;
      try { rem = JSON.parse(v); } catch(e){ return; }
      if (!rem || !rem.lists) return;
      var rts = rem.ts || 0;
      if (rts <= localTs) return;
      if (editing || saveTimer) return;
      localTs = rts;
      state.lists = normalizeLists(rem.lists);
      state.titles = rem.titles || {};
      buildIndex();
      render();
      setTabUI();
      flushMigration();
    });
  }
  function startPoll(){
    if (!SHARED) return;
    setInterval(pullRemote, 12000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) pullRemote();
    });
  }

  function finish(){
    render();
    setTabUI();
    startPoll();
  }
  function boot(lists, titles){
    // titles: דריסות של כותרות קבוצות שנערכו, מפתח "טאב-קבוצה" -> {t, s}
    state = {v: 3, lists: normalizeLists(lists), titles: titles || {}};
    buildIndex();
    flushMigration();
    store.get(TABKEY, false).then(function(t){
      if (t === 'A' || t === 'S' || t === 'L') activeTab = t;
      return store.get(FOLDKEY, false);
    }).then(function(fv){
      if (fv){ try { fold = JSON.parse(fv) || {}; } catch(e){ fold = {}; } }
      finish();
    });
  }
  function seedFromV2(ov){
    var lists = seedAll();
    if (ov){
      try {
        var old2 = JSON.parse(ov) || {};
        var idx = {};
        ['L','A','S'].forEach(function(p){
          ORDER[p].forEach(function(k){
            lists[p][k].forEach(function(it){ idx[it.id] = it; });
          });
        });
        Object.keys(old2).forEach(function(id){
          if (old2[id] === true && idx[id]) idx[id].d = true;
        });
      } catch(e){}
    }
    return lists;
  }
  // ── התחברות וסנכרון Supabase ──
  function readCache(){
    var v = null;
    try { v = window.localStorage.getItem(KEY); } catch(e){}
    if (!v) return null;
    try { return JSON.parse(v); } catch(e){ return null; }
  }
  function showAuth(){
    var av = document.getElementById('authView');
    av.hidden = false;
    var f = document.getElementById('googleBtn');
    if (f) f.focus();
  }
  function startApp(){
    document.getElementById('authView').hidden = true;
    document.getElementById('logoutBtn').hidden = false;
    // קודם מרנדרים מהמטמון המקומי (מיידי), ואז מיישרים מול הענן
    var lp = readCache();
    localTs = lp && lp.ts ? lp.ts : 0;
    boot(lp && lp.lists ? lp.lists : seedAll(), lp ? lp.titles : null);
    store.get(KEY, true).then(function(v){
      var rem = null;
      if (v){ try { rem = JSON.parse(v); } catch(e){} }
      if (rem && rem.lists){
        if ((rem.ts || 0) >= localTs){
          // הענן מעודכן יותר או שווה - מאמצים אותו
          localTs = rem.ts || 0;
          state.lists = normalizeLists(rem.lists);
          state.titles = rem.titles || {};
          buildIndex();
          render();
          setTabUI();
          flushMigration();
        } else {
          // המקומי מעודכן יותר (עריכות בלי רשת) - דוחפים למעלה
          persist();
        }
      } else {
        // אין עדיין נתונים בענן - ההעלאה הראשונה של ההתקדמות הקיימת
        persist();
      }
    });
  }
  document.getElementById('googleBtn').addEventListener('click', function(){
    if (!sb) return;
    var err = document.getElementById('authErr');
    err.textContent = '';
    // חוזרים בדיוק לכתובת של הדף הזה - היא חייבת להופיע ב־Redirect URLs בדשבורד.
    // בשורש (localhost) משמיטים את הלוכסן כדי להתאים לרשומה שם אחד לאחד
    var back = window.location.origin + (window.location.pathname === '/' ? '' : window.location.pathname);
    sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: back}}).then(function(res){
      // הצלחה = הדפדפן עוזב לעמוד של גוגל; לכאן מגיעים רק אם משהו נכשל עוד לפני
      if (res.error) err.textContent = 'החיבור לגוגל לא הצליח - נסו שוב';
    });
  });
  document.getElementById('logoutBtn').addEventListener('click', function(){
    if (!sb) return;
    // אחרי יציאה, טעינה מחדש מחזירה למסך ההתחברות
    sb.auth.signOut().then(function(){ location.reload(); });
  });

  function init(){
    if (store.mode === 'supabase'){
      // session שמור מהתחברות קודמת? נכנסים ישר. אין? מסך התחברות
      sb.auth.getSession().then(function(res){
        var session = res && res.data ? res.data.session : null;
        if (session) startApp(); else showAuth();
      });
      return;
    }
    if (store.mode === 'none'){
      boot(seedAll());
      return;
    }
    store.get(KEY, true).then(function(v){
      var loaded = null;
      if (v){ try { loaded = JSON.parse(v); } catch(e){} }
      if (loaded && loaded.lists){
        localTs = loaded.ts || 0;
        boot(loaded.lists, loaded.titles);
        return;
      }
      if (!SHARED){
        boot(seedAll());
        persist();
        return;
      }
      // אין עדיין מצב משותף — מעבירים מהשמירה האישית הקודמת
      store.get(KEY, false).then(function(pv){
        var old3 = null;
        if (pv){ try { old3 = JSON.parse(pv); } catch(e){} }
        if (old3 && old3.lists){
          boot(old3.lists, old3.titles);
          persist();
          return;
        }
        store.get(OLDKEY, false).then(function(ov){
          boot(seedFromV2(ov));
          persist();
        });
      });
    });
  }
  init();
})();
</script>

    return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // מרקר אחד לכל מיקום - תחנות שחוזרות (LAX, רינו) מתאחדות לאותו מרקר
  var groups = {};
  TRIP.forEach(function(st){
    var key = st.lat + ',' + st.lng;
    (groups[key] = groups[key] || []).push(st);
  });

  function driveHTML(st){
    if (!st.drive) return '';
    var h = '<div class="drv">נסיעה: <bdi>' + escR(st.drive) + '</bdi>';
    if (st.drive2) h += ' · ' + escR(st.drive2.t) + ' <bdi>' + escR(st.drive2.v) + '</bdi>';
    return h + '</div>';
  }
  function cardHTML(st){
    return '<div class="dcard" data-n="' + st.n + '" tabindex="0" role="button">' +
      '<div class="dd">' + escR(st.date) + (st.wd ? ' · יום ' + escR(st.wd) : '') + '</div>' +
      '<div class="dn"><span>' + st.emoji + '</span><bdi>' + escR(st.name) + '</bdi></div>' +
      driveHTML(st) +
      (st.note ? '<div class="nt">' + escR(st.note) + '</div>' : '') +
      '</div>';
  }
  document.getElementById('rpanel').innerHTML = TRIP.map(cardHTML).join('');

  var map = null, markerByN = {}, routeBounds = null, didFirstFit = false;
  function popupHTML(list){
    return list.map(function(st){
      return '<div class="pp-name">' + st.emoji + ' <bdi>' + escR(st.name) + '</bdi></div>' +
        '<div class="pp-date">' + escR(st.date) + (st.wd ? ' · יום ' + escR(st.wd) : '') + '</div>' +
        (st.note ? '<div class="pp-note">' + escR(st.note) + '</div>' : '');
    }).join('<hr style="border:none;border-top:1px solid var(--line);margin:8px 0">');
  }
  function initMap(){
    if (map) return true;
    // בלי רשת אין ספריית מפה - הכרטיסים ממשיכים לעבוד
    if (typeof L === 'undefined'){
      document.getElementById('rmap').innerHTML =
        '<div class="rmap-fallback">המפה נטענת מהרשת ולא הצליחה להיטען. כרטיסי הימים עובדים כרגיל.</div>';
      return false;
    }
    map = L.map('rmap');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd', maxZoom: 19
    }).addTo(map);
    // קו מסלול 4px עם הילה רחבה ושקופה מתחתיו - ה־glow של האתר בגרסת מפה
    var allPts = [];
    ROUTE_GEOM.forEach(function(leg){
      L.polyline(leg, {color:'#E9398C', weight:11, opacity:.16, interactive:false}).addTo(map);
      L.polyline(leg, {color:'#E9398C', weight:4, opacity:.9, interactive:false}).addTo(map);
      allPts = allPts.concat(leg);
    });
    Object.keys(groups).forEach(function(key){
      var list = groups[key];
      var isBurn = list.some(function(s){ return s.type === 'burn'; });
      var label = isBurn ? '🔥' : list.map(function(s){ return s.n; }).join('·');
      var icon = L.divIcon({
        className: '',
        html: '<div class="mk' + (isBurn ? ' burn' : '') + '">' + label + '</div>',
        iconSize: isBurn ? [40, 40] : [30, 30],
        iconAnchor: isBurn ? [20, 20] : [15, 15],
        popupAnchor: [0, isBurn ? -24 : -18]
      });
      var mk = L.marker([list[0].lat, list[0].lng], {icon: icon}).addTo(map);
      mk.bindPopup(popupHTML(list));
      list.forEach(function(s){ markerByN[s.n] = mk; });
    });
    routeBounds = L.latLngBounds(allPts);
    map.fitBounds(routeBounds, {padding: [30, 30]});
    return true;
  }

  // לחיצה על כרטיס יום מטיסה את המפה לתחנה ופותחת את הפופאפ שלה
  function activateCard(c){
    document.querySelectorAll('.dcard.on').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    if (!map) return;
    var st = null;
    TRIP.forEach(function(s){ if (s.n === +c.dataset.n) st = s; });
    if (!st) return;
    map.flyTo([st.lat, st.lng], 10, {duration: 1.1});
    var mk = markerByN[st.n];
    if (mk) setTimeout(function(){ mk.openPopup(); }, 1150);
  }
  document.getElementById('rpanel').addEventListener('click', function(ev){
    var c = ev.target.closest ? ev.target.closest('.dcard') : null;
    if (c) activateCard(c);
  });
  document.getElementById('rpanel').addEventListener('keydown', function(ev){
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var c = ev.target.closest ? ev.target.closest('.dcard') : null;
    if (!c) return;
    ev.preventDefault();
    activateCard(c);
  });

  // ── שני הטאבים הראשיים; המצב נשמר ב־hash כדי שרענון ישאיר אותך באותו טאב ──
  function setView(v, push){
    document.body.classList.toggle('vroute', v === 'route');
    document.querySelectorAll('.mtab').forEach(function(b){ b.classList.toggle('on', b.dataset.view === v); });
    if (push && location.hash !== '#' + v) location.hash = v;
    if (v === 'route' && initMap()){
      // המפה הייתה בתוך אזור מוסתר - חובה לרענן את המידות שלה.
      // אחרי הרענון הראשון גם ממסגרים מחדש את כל המסלול, כי ה־fitBounds
      // המקורי רץ לפני שמידות הקונטיינר התייצבו
      setTimeout(function(){
        map.invalidateSize();
        if (!didFirstFit && routeBounds){
          didFirstFit = true;
          map.fitBounds(routeBounds, {padding: [30, 30]});
        }
      }, 0);
    }
  }
  document.querySelectorAll('.mtab').forEach(function(b){
    b.addEventListener('click', function(){ setView(b.dataset.view, true); });
  });
  window.addEventListener('hashchange', function(){
    setView(location.hash === '#packing' ? 'packing' : 'route', false);
  });
  setView(location.hash === '#packing' ? 'packing' : 'route', false);
})();
</script>
</body>
</html>
